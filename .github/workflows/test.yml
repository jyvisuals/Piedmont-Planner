name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site
        run: node scripts/validate-site.mjs

      - name: Cross-check planting windows against NC State (informational)
        run: node scripts/compare-ncsu.mjs
