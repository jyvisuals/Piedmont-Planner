name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site
        run: node scripts/validate-site.mjs

      - name: Cross-check planting windows against NC State (informational)
        run: node scripts/compare-ncsu.mjs

      - name: Typecheck schema contracts
        run: npx --yes -p typescript@6 tsc --noEmit -p schema/tsconfig.json

      - name: Engine + golden regression tests (Carrboro must not move)
        run: node --test schema/tests/*.test.mjs

      - name: App bundle freshness (committed app/ artifacts match source)
        run: |
          node scripts/build-app-lib.mjs
          git diff --exit-code app/

      - name: Verify national ZIP/zone shards (offline)
        run: node scripts/etl/verify-zip-zones.mjs

      - name: Verify national frost tiles (offline)
        run: node scripts/etl/verify-frost-tiles.mjs

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI test harness + Chromium
        working-directory: tests/ui
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: UI smoke test (headless Chromium)
        run: node tests/ui/smoke.mjs
