name: Deploy to GitHub Pages

# Deploy only after the full "Validate" workflow (validation, engine, artifact,
# and UI smoke jobs in test.yml) has succeeded on main. Gating on workflow_run
# — rather than re-running a lightweight subset here — guarantees the deployed
# site passed the same checks that guard every PR.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch always deploys; workflow_run only when a *push* to main
    # validated successfully. Requiring event == 'push' rejects a fork PR whose
    # source branch happens to be named "main" (test.yml also runs Validate on
    # pull_request), which would otherwise satisfy the branch check and start a
    # write-permission Pages deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, GITHUB_SHA is the default branch tip — not the
          # commit that actually passed Validate. With overlapping pushes that
          # could package a newer, unvalidated commit. Check out exactly the SHA
          # whose Validate run triggered us (falls back to the ref for dispatch).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
