name: Deploy to GitHub Pages

# Deploy only after the full "Validate" workflow (validation, engine, artifact,
# and UI smoke jobs in test.yml) has succeeded on main. Gating on workflow_run
# — rather than re-running a lightweight subset here — guarantees the deployed
# site passed the same checks that guard every PR.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch always deploys; workflow_run only when the Validate run
    # succeeded on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
